name: Update cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bump to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo brksfrb/arctic-launcher --json tagName -q .tagName)
          version="${tag#v}"
          current=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/arctic-launcher.rb)
          if [ "$version" = "$current" ]; then echo "already on $version"; exit 0; fi
          # The Mac files are attached after the Windows and Linux ones: wait for them.
          if ! gh release view "$tag" --repo brksfrb/arctic-launcher --json assets -q '.assets[].name' | grep -qx arctic-launcher-macos.zip; then
            echo "$tag has no Mac download yet"; exit 0
          fi
          sha=$(gh release download "$tag" --repo brksfrb/arctic-launcher -p arctic-launcher-macos.zip -O - | sha256sum | cut -d' ' -f1)
          sed -i "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/arctic-launcher.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "arctic-launcher $version"
          git push
